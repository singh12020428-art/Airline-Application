      service-registry:
        condition: service_started
      locationdb:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "location-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://locationdb:3306/airline_location_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      - zosh

  seat-service:
    image: "mrsingh1/yt-gds-seat:1.0.0"
    container_name: yt-gds-seat-service
    # NO PORTS EXPOSED - Internal only
    depends_on:
      # config-server:
      #   condition: service_started
      service-registry:
        condition: service_started
      seatdb:
        condition: service_started
      # kafka:
      #   condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "seat-service"
      # SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://seatdb:3306/airline_seat_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      # SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - zosh

  pricing-service:
    image: "mrsingh1/yt-gds-pricing:1.0.0"
    container_name: yt-gds-pricing-service
    # NO PORTS EXPOSED - Internal only
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      pricingdb:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "pricing-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://pricingdb:3306/airline_pricing_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      - zosh

  ancillary-service:
    image: "mrsingh1/yt-gds-ancillary:1.0.0"
    container_name: yt-gds-ancillary-service
    # NO PORTS EXPOSED - Internal only
    depends_on:
      config-server:
