# =============================================================================
# Airline Microservices — Docker Compose
# =============================================================================
# ONLY API GATEWAY (Port 5000) is exposed externally
# All other services are internal only
# =============================================================================

services:

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # ========== USER DB ==========
  userdb:
    image: mysql:8.0
    container_name: userdb
    ports:
      - "127.0.0.1:3302:3306"  # LOCALHOST ONLY - for debugging if needed
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_user
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== AIRLINE CORE DB ==========
  airlinecoredb:
    image: mysql:8.0
    container_name: airlinecoredb
    ports:
      - "127.0.0.1:3303:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_core_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== FLIGHT OPS DB ==========
  flightopsdb:
    image: mysql:8.0
    container_name: flightopsdb
    ports:
      - "127.0.0.1:3304:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_flight_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== LOCATION DB ==========
  locationdb:
    image: mysql:8.0
    container_name: locationdb
    ports:
      - "127.0.0.1:3305:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_location_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== SEAT DB ==========
  seatdb:
    image: mysql:8.0
    container_name: seatdb
    ports:
      - "127.0.0.1:3311:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_seat_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== PRICING DB ==========
  pricingdb:
    image: mysql:8.0
    container_name: pricingdb
    ports:
      - "127.0.0.1:3307:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_pricing_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== ANCILLARY DB ==========
  ancillarydb:
    image: mysql:8.0
    container_name: ancillarydb
    ports:
      - "127.0.0.1:3308:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_ancillary_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== BOOKING DB ==========
  bookingdb:
    image: mysql:8.0
    container_name: bookingdb
    ports:
      - "127.0.0.1:3309:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_booking_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh

  # ========== PAYMENT DB ==========
  paymentdb:
    image: mysql:8.0
    container_name: paymentdb
    ports:
      - "127.0.0.1:3310:3306"  # LOCALHOST ONLY
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_payment_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - zosh


  # ===========================================================================
  # CONFIG SERVER
  # ===========================================================================

  config-server:
    image: "mrsingh1/yt-gds-config-server:1.0.0"
    container_name: yt-gds-config-server
    # NO PORTS EXPOSED - Internal only
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "https://github.com/singh12020428-art/zosh-air-config"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
    restart: unless-stopped
    networks:
      - zosh

  # ===========================================================================
  # SERVICE REGISTRY (Eureka)
  # ===========================================================================

  service-registry:
    image: "mrsingh1/yt-gds-service-registry:1.0.0"
    container_name: yt-gds-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
    restart: unless-stopped
    networks:
      - zosh

  # ===========================================================================
  # API GATEWAY - ONLY EXTERNALLY EXPOSED SERVICE
  # ===========================================================================

  api-gateway:
    image: "mrsingh1/yt-gds-api-gateway:1.0.0"
    container_name: yt-gds-api-gateway
    ports:
      - "5000:5000"  # ONLY PORT EXPOSED TO THE WORLD
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      - zosh

  # ===========================================================================
  # BUSINESS SERVICES - ALL INTERNAL (NO PORTS EXPOSED)
  # ===========================================================================

  user-service:
    image: "mrsingh1/yt-gds-user:1.0.0"
    container_name: yt-gds-user-service
    # NO PORTS EXPOSED - Internal only
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      userdb:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://userdb:3306/airline_user?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
    restart: unless-stopped
    networks:
      - zosh

  airline-core-service:
    image: "mrsingh1/yt-gds-airline:1.0.0"
    container_name: yt-gds-airline-core-service
    # NO PORTS EXPOSED - Internal only
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      airlinecoredb:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "airline-core-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://airlinecoredb:3306/airline_core_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      - zosh

  notification-service:
    image: "mrsingh1/yt-gds-notification:1.0.0"
    container_name: yt-gds-notification-service
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "notification-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - zosh

  flight-ops-service:
    image: "mrsingh1/yt-gds-flight:1.0.0"
    container_name: yt-gds-flight-ops-service
    # NO PORTS EXPOSED - Internal only
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      flightopsdb:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "flight-ops-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://flightopsdb:3306/airline_flight_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      - zosh

  location-service:
    image: "mrsingh1/yt-gds-location:1.0.0"
    container_name: yt-gds-location-service
    # NO PORTS EXPOSED - Internal only
    depends_on:
      config-server:
